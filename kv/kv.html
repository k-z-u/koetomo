*{box-sizing:border-box} html,body{margin:0}
body{width:1920px;height:1080px;overflow:hidden;background:#F6F7F9;font-family:"Noto Sans JP",sans-serif;color:#17191D;position:relative}
.glow{position:absolute;right:-120px;top:-60px;width:1300px;height:1200px;background:radial-gradient(closest-side,#FFFFFF 0%,rgba(255,255,255,.7) 45%,rgba(246,247,249,0) 100%)}

.bubble i{font-style:normal;color:#16C4DA}
.sparks{position:absolute;right:90px;top:250px;width:150px}
.modes{position:absolute;left:140px;bottom:78px;display:flex;gap:14px;align-items:center}
.modes .label{font-size:20px;font-weight:700;color:#9AA0A8;letter-spacing:.08em;margin-right:6px;writing-mode:horizontal-tb}
.chip{display:flex;align-items:center;gap:10px;background:#fff;border-radius:22px;padding:10px 18px 10px 12px;box-shadow:0 8px 24px rgba(20,30,45,.06)}
.chip .mini{width:62px;height:48px}
.chip span{display:flex;flex-direction:column;line-height:1.25}
.chip b{font-size:19px} .chip small{font-size:13px;color:#9AA0A8;font-weight:500}
