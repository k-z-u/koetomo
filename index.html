<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F6F7F9">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">

<title>こえとも</title>
<style>
  :root { --bg: #F6F7F9; --surface: #fff; --ink: #17191D; --soft: #5B6068; --faint: #9AA0A8; --line: #E7E9ED; --cyan: #16C4DA; --red: #E5484D; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink);
    font-family: "Hiragino Maru Gothic ProN", "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif; }
  body { display: grid; place-items: center; padding: 16px; }
  body.checking form { display: none; }
  .card { width: min(340px, 100%); background: var(--surface); border-radius: 24px; padding: 26px 24px 22px;
    box-shadow: 0 10px 40px rgba(20,30,45,.07), 0 2px 8px rgba(20,30,45,.04); text-align: center; }
  .lock { width: 44px; height: 44px; margin: 0 auto 10px; border-radius: 14px; background: #E3F8FB; display: grid; place-items: center; }
  .lock svg { width: 22px; height: 22px; }
  h1 { margin: 0; font-size: 19px; font-weight: 800; letter-spacing: .02em; }
  p { margin: 6px 0 16px; font-size: 13px; color: var(--soft); }
  input { width: 100%; height: 46px; border: 1.5px solid var(--line); border-radius: 14px; padding: 0 14px;
    font: inherit; font-size: 16px; text-align: center; letter-spacing: .12em; outline: none; background: #fff; color: var(--ink); }
  input:focus { border-color: var(--cyan); }
  button { margin-top: 10px; width: 100%; height: 46px; border: 0; border-radius: 14px; background: var(--ink); color: #fff;
    font: inherit; font-size: 15px; font-weight: 700; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  .msg { min-height: 18px; margin-top: 10px; font-size: 12.5px; color: var(--faint); }
  .msg.bad { color: var(--red); }
  .shake { animation: shake .36s; }
  @keyframes shake { 20%, 60% { transform: translateX(-7px); } 40%, 80% { transform: translateX(7px); } }
  @media (max-height: 420px) { .card { padding: 18px 22px 14px; } .lock { display: none; } p { margin-bottom: 12px; } }
</style>
</head>

</div>

const b64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
const store = {
  get(k) { try { return localStorage.getItem("koetomo." + k) || ""; } catch { return ""; } },
  set(k, v) { try { localStorage.setItem("koetomo." + k, v); } catch {} },
  del(k) { try { localStorage.removeItem("koetomo." + k); } catch {} },
};

async function deriveKey(pw) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({ name: "PBKDF2", salt: b64(LOCK.salt), iterations: LOCK.iter, hash: "SHA-256" },
    base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
}
const open = (key, bytes) => crypto.subtle.decrypt({ name: "AES-GCM", iv: bytes.slice(0, 12) }, key, bytes.slice(12));

async function unlock(pw) {
  const key = await deriveKey(pw);
  const app = JSON.parse(new TextDecoder().decode(await open(key, b64(LOCK.app))));   // パスワード違いならここで失敗する
  // 3D のモデルなどは、使うときに取りに行って開ける
  const cache = new Map();
  window.koetomoAsset = (path) => {
    const f = app.assets[path];
    if (!f) return Promise.resolve(path);
    if (!cache.has(path)) cache.set(path, fetch(f.file).then((r) => r.arrayBuffer())
      .then((buf) => open(key, new Uint8Array(buf)))
      .then((plain) => URL.createObjectURL(new Blob([plain], { type: f.type }))));
    return cache.get(path);
  };
  return app.html;
}

function start(html) {
  document.open(); document.write(html); document.close();
}

const $ = (id) => document.getElementById(id);
async function tryPw(pw, fromStore) {
  $("go").disabled = true; $("msg").className = "msg"; $("msg").textContent = "ひらいています…";
  try {
    const html = await unlock(pw);
    store.set("pass", pw);
    start(html);
  } catch {
    document.body.classList.remove("checking");
    $("go").disabled = false;
    if (fromStore) { store.del("pass"); $("msg").textContent = ""; $("pw").focus(); return; }
    $("msg").className = "msg bad"; $("msg").textContent = "パスワードがちがうみたい";
    $("card").classList.remove("shake"); void $("card").offsetWidth; $("card").classList.add("shake");
    $("pw").select();
  }
}
$("f").addEventListener("submit", (e) => { e.preventDefault(); const pw = $("pw").value; if (pw) tryPw(pw, false); });

if (!window.isSecureContext || !crypto.subtle) {
  document.body.classList.remove("checking");
  $("msg").className = "msg bad"; $("msg").textContent = "https で開いてね";
} else if (store.get("pass")) {
  tryPw(store.get("pass"), true);           // 前に入れたことがあれば、そのまま開く
} else {
  document.body.classList.remove("checking"); $("pw").focus();
}
})();
</script>
